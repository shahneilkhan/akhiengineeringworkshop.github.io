<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><link rel="icon" href="./logo.png">
<meta name="description" content="Akhi Engineering Workshop, Moulvibazar. Furniture, office chairs, desks and furniture for homes and workspaces.">
<title>Akhi Engineering Workshop | Furniture & Office Chairs</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--acc:#e2262d;--ink:#222;--mut:#777;--line:#e6e6e6}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}body{font:16px/1.5 Barlow,system-ui,sans-serif;color:var(--ink);background:#fff}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}button{font:inherit}svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.hd{position:fixed;top:0;left:0;right:0;z-index:50;height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;color:#fff;transition:background .25s,color .25s;padding-top:env(safe-area-inset-top)}
.hd.solid{background:#fff;color:var(--ink);border-bottom:1px solid var(--line)}
.logo{background:var(--acc);color:#fff;font-weight:700;font-size:34px;letter-spacing:.02em;padding:0 14px;line-height:46px;border-radius:2px}
.nv{display:flex;gap:34px;font-weight:500;font-size:17px;text-shadow:0 1px 8px rgba(0,0,0,.35)}.hd.solid .nv{text-shadow:none}.nv button,.nv a{background:none;border:0;color:inherit;cursor:pointer;padding:6px 0;border-bottom:2px solid transparent}.nv button:hover,.nv a:hover{border-color:var(--acc)}
.ic{display:flex;gap:18px;align-items:center;padding-right:16px}.ic button{background:none;border:0;color:inherit;cursor:pointer;display:grid;place-items:center}.mm{display:none}
.sp{position:fixed;top:78px;left:0;right:0;z-index:49;background:#fff;border-bottom:1px solid var(--line);padding:14px 20px;display:none}.sp.on{display:block}.sp input{width:100%;max-width:700px;margin:auto;display:block;border:1px solid var(--line);padding:12px 16px;font:inherit;outline:0;border-radius:4px}
.hero{position:relative;height:100svh;min-height:560px;background:#1b1b1b;overflow:hidden}
.sl{position:absolute;inset:0;opacity:0;transition:opacity .9s;display:flex;align-items:center;background:linear-gradient(120deg,#1d1d20,#4a1519)}.sl.on{opacity:1;z-index:1}
.sl>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.sl:before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.42);z-index:1}
.t{position:relative;z-index:2;color:#fff;padding:0 7vw;max-width:1100px;margin:0 auto;width:100%}
.t h1,.t h2{font-weight:700;font-size:clamp(38px,6.4vw,84px);line-height:1.05;letter-spacing:-.01em}
.t p{font-weight:300;font-size:clamp(22px,3.8vw,52px);line-height:1.15;margin:22px 0 0 8vw;position:relative}.t p:before{content:"";position:absolute;left:-8vw;top:50%;width:6vw;border-top:1px solid #fff;opacity:.7}
.t .b{display:inline-block;margin:34px 0 0;background:var(--acc);color:#fff;padding:12px 30px;font-weight:600;border-radius:2px}
.dots{position:absolute;bottom:22px;left:0;right:0;display:flex;gap:10px;justify-content:center;z-index:3}.dots i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.45);cursor:pointer}.dots i.on{background:#fff}
.call{position:fixed;left:8px;bottom:12px;z-index:40;color:#fff;font-size:13px;display:flex;flex-direction:column;gap:2px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.chat{position:fixed;right:22px;bottom:22px;z-index:40;width:58px;height:58px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(226,38,45,.4)}.chat svg{width:28px;height:28px;fill:#fff;stroke:none}
.sh{max-width:1300px;margin:auto;padding:34px 20px 10px}.bc{text-align:center;font-size:13px;font-weight:500;color:var(--ink)}.bc b{color:var(--acc);font-weight:600}
h2.tt{font-weight:400;font-size:34px;text-align:center;margin:16px 0 28px;letter-spacing:.02em}h2.tt span{display:inline-block;border-bottom:2px solid var(--ink);padding-bottom:2px}
.cats{display:flex;flex-wrap:wrap;justify-content:center;gap:20px}.cats .ct{width:210px}#shop{scroll-margin-top:84px}
.ct{background:#fff;border:1px solid var(--line);padding:8px;cursor:pointer;text-align:center}.ct .i{aspect-ratio:1/1;background:#f1f1f1;overflow:hidden}.ct img{width:100%;height:100%;object-fit:cover;transition:transform .4s}.ct:hover img{transform:scale(1.04)}.ct b{display:block;font-weight:500;font-size:22px;padding:12px 4px 6px}
.res{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin:34px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:30px 26px}
.card .ph{aspect-ratio:1/1;background:#f4f4f4;position:relative;overflow:hidden;display:grid;place-items:center}.card .ph img{width:100%;height:100%;object-fit:cover}
.sm{position:absolute;top:10px;left:10px;z-index:2;background:#222;color:#fff;font:600 11px Barlow;padding:3px 9px;border-radius:2px;font-style:normal}.card h3{font-size:17px;font-weight:600;margin-top:14px}.card .pr{color:var(--mut);margin:6px 0 8px;font-size:17px}
.card .ad{font-weight:600;font-size:15px;display:inline-flex;gap:8px;align-items:center}.card .ad svg{width:18px;height:18px}.card .ad:hover{color:var(--acc)}
.empty{color:var(--mut);padding:24px 0}
footer{background:#111;color:#bbb;margin-top:60px;padding:44px 20px 18px}footer .w{max-width:1300px;margin:auto;display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:30px}footer h4{color:#fff;font-size:18px;margin-bottom:10px}footer li{list-style:none;padding:2px 0}footer ul{padding:0}footer a:hover{color:#fff}
.fb{max-width:1300px;margin:30px auto 0;border-top:1px solid #333;padding-top:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:14px}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media(max-width:900px){.nv{display:none;position:fixed;top:78px;left:0;right:0;background:#fff;color:var(--ink);flex-direction:column;gap:0;padding:8px 20px;text-shadow:none;max-height:70vh;overflow:auto}.nv.on{display:flex}.nv button,.nv a{text-align:left;padding:12px 0;border-bottom:1px solid var(--line)}.mm{display:grid}footer .w{grid-template-columns:1fr}.logo{font-size:28px;line-height:40px}}
@media(prefers-reduced-motion:reduce){.sl{transition:none}html{scroll-behavior:auto}}
.logo{line-height:1.05!important;padding:8px 14px!important;text-align:center}.logo small{display:block;font-size:8px;letter-spacing:.16em;font-weight:600;margin-top:3px}
.logo{background:#fff!important;color:var(--acc);padding:4px 10px!important;border-radius:4px;display:flex;align-items:center;justify-content:center}.logo img{height:50px;width:auto;display:block}.logo.txt{background:var(--acc)!important;color:#fff;display:block;padding:8px 14px!important}@media(max-width:900px){.logo img{height:40px}}
:root{--acc:#a4b81c;--accd:#5d6b08}
.hd{height:86px}.sp{top:86px}#shop{scroll-margin-top:92px}
.logo{background:none!important;padding:0 6px!important;border-radius:0}.logo img{height:68px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.logo.txt{background:#111!important;color:var(--acc);padding:8px 14px!important}
.t .b{color:#111!important;font-weight:700}
.chat{color:#111;box-shadow:0 8px 24px rgba(164,184,28,.45)}.chat svg{fill:#111}
.bc b,.card .ad:hover,.nv button:hover{color:var(--accd)}.hd:not(.solid) .nv button:hover,.hd:not(.solid) .nv a:hover{color:#fff}
.sm{background:#111;color:var(--acc)}footer h4{color:var(--acc)}.nv button,.nv a{border-bottom-width:3px}
@media(max-width:900px){.nv,.sp{top:86px}.logo img{height:56px}}
.logo{display:flex!important;align-items:center;gap:12px}.bn{font:700 21px/1.1 Barlow,sans-serif;color:#fff;max-width:210px;text-shadow:0 1px 8px rgba(0,0,0,.45)}.hd.solid .bn{color:var(--ink);text-shadow:none}
@media(min-width:901px) and (max-width:1180px){.bn{display:none}}@media(max-width:900px){.bn{font-size:15px;max-width:130px}}@media(max-width:380px){.bn{display:none}}
</style></head><body>
<header class="hd" id="hd"><a class="logo" href="#top" aria-label="Akhi Engineering Workshop"><img src="./logo.png" alt="Akhi Engineering Workshop" onerror="this.parentNode.classList.add('txt');this.parentNode.innerHTML='AKHI<small>ENGINEERING WORKSHOP</small>'"><span class="bn" id="bn">Akhi Engineering Workshop</span></a><nav class="nv" id="nv"></nav><div class="ic"><button id="sb" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button><a id="bag" href="#contact" aria-label="Order on WhatsApp" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h10.2L20 7H6.2"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg></a><button class="mm" id="mm" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div></header>
<div class="sp" id="sp"><input id="q" type="search" placeholder="Search chairs, desks, tables…" aria-label="Search products"></div>
<main id="top"><section class="hero"><div id="slides"></div><div class="dots" id="dots"></div></section>
<section class="sh" id="shop"><div class="bc">Shop &nbsp;&gt;&nbsp; <b id="bc">All products</b></div><h2 class="tt"><span id="pt">All products</span></h2><div class="cats" id="cats"></div>
<div class="res"><span id="rc"></span><span></span></div><div class="grid" id="grid"></div></section></main>
<a class="call" id="call" href="#contact" style="display:none"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg><span id="callN"></span></a>
<a class="chat" id="chat" href="#contact" target="_blank" rel="noopener" aria-label="Chat on WhatsApp"><svg viewBox="0 0 24 24"><path d="M4 4h16a1 1 0 011 1v11a1 1 0 01-1 1H9l-5 4V5a1 1 0 011-1z"/></svg></a>
<footer id="contact"><div class="w"><div><h4 id="fN">Akhi Engineering Workshop</h4><p>Office chairs, desks and furniture for homes and workspaces.</p></div><div><h4>Categories</h4><ul id="fCats"></ul></div><div><h4>Contact</h4><ul id="fList"></ul></div></div><div class="fb"><span id="foot">© Akhi Engineering Workshop</span><span><a href="https://shahneilkhan.github.io/" target="_blank" rel="noopener">Developer · SNK</a> · <a href="./admin/login/">Admin</a></span></div></footer>
<script src="./firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(async()=>{const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const U=id=>`https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=900&q=80`,I={l1:'1618221195710-dd6b41faaea6',l2:'1555041469-a586c61ea9bc',l3:'1616486338812-3dadae4b4ace',b1:'1505693416388-ac5ce068fe85',d1:'1519710164239-da123dc03ef4',m1:'1540574163026-643ea20ade25',m2:'1598300042247-d088f8ab3a91'};
const DEMO=[['Modern Sofa Set','Living Room',45000,'l2'],['Lounge Chair','Living Room',12500,'m1'],['Living Room Set','Living Room',68000,'l1'],['Cozy Armchair','Living Room',9800,'l3'],['Wooden Bed','Bedroom',38000,'b1'],['Bedroom Set','Bedroom',72000,'b1'],['Bedside Table','Bedroom',6500,'m2'],['Dining Table Set','Dining',52000,'d1'],['Dining Chair','Dining',4800,'m2'],['Ergonomic Mesh Office Chair','Office',6800],['Executive Office Desk','Office',18500],['Visitor Chair','Office',4300]].map((x,i)=>({title:x[0],category:x[1],price:x[2],image:x[3]?U(I[x[3]]):'',order:i,demo:1}));
const DEMOB=[{title:'Furniture for beautiful living',description:'Comfort, strength and a clean look for every room.',image:U(I.l3)},{title:'Make your office comfortable',description:'Chairs and desks built for long working days.',image:U(I.l1)},{title:'Rest in good design',description:'Bedroom and dining furniture for your home.',image:U(I.b1)}];
let S={},H={},P=[],B=[];
try{const c=AKI_FIREBASE_CONFIG;if(String(c.apiKey).startsWith('YOUR'))throw 0;firebase.initializeApp(c);const db=firebase.firestore(),ls=s=>s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.published!==false).sort((a,b)=>(a.order??999)-(b.order??999));
 const [h,s,p,b]=await Promise.all([db.collection('siteContent').doc('home').get(),db.collection('siteContent').doc('settings').get(),db.collection('projects').get(),db.collection('banners').get()]);
 H=h.data()||{};S=s.data()||{};P=ls(p);B=ls(b)}catch(e){}
const NAME=(S.name||'Akhi Engineering Workshop').trim();document.title=NAME+' | Furniture & Office Chairs';$('#fN').textContent=NAME;const bn=$('#bn');if(bn)bn.textContent=NAME;if(S.logo){const li=document.querySelector('.logo img');if(li){li.src=S.logo;li.alt=NAME}document.querySelector('link[rel=icon]').href=S.logo}
const demoMode=!P.length;if(demoMode)P=DEMO;
let n=String(S.whatsapp||S.phone||'').replace(/\D/g,'');if(n.startsWith('0'))n='880'+n.slice(1);
const wa=t=>n?`https://wa.me/${n}?text=${encodeURIComponent(t)}`:(S.email?`mailto:${S.email}?subject=${encodeURIComponent(t)}`:'#contact');
const price=v=>/^\d+$/.test(String(v||'').trim())?'৳'+Number(v).toLocaleString('en-US'):String(v||'');
const hello=wa('Hello '+NAME+', I want to enquire about your furniture.');$('#bag').href=hello;$('#chat').href=hello;
if(S.phone){$('#call').style.display='flex';$('#callN').textContent=S.phone;$('#call').href='tel:'+S.phone.replace(/[^\d+]/g,'')}
$('#foot').textContent=S.footer||('© '+NAME);
$('#fList').innerHTML=[S.address,S.phone,S.email,S.facebook].filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>Moulvibazar, Bangladesh</li>';
/* header */
const hd=$('#hd'),sc=()=>hd.classList.toggle('solid',scrollY>60||$('#nv').classList.contains('on'));addEventListener('scroll',sc);sc();
$('#sb').onclick=()=>{$('#sp').classList.toggle('on');$('#q').focus()};$('#mm').onclick=()=>{$('#nv').classList.toggle('on');sc()};
/* slider */
const sl=B.length?B:demoMode?DEMOB:[{title:H.heroTitle||'Furniture for comfortable workdays.',description:H.heroDescription||'Office chairs, desks and furniture built for comfort.'}];
$('#slides').innerHTML=sl.map((x,i)=>`<div class="sl">${x.image?`<img src="${esc(x.image)}" alt="" ${i?'loading="lazy"':''} onerror="this.remove()">`:''}<div class="t">${i?`<h2>${esc(x.title)}</h2>`:`<h1>${esc(x.title)}</h1>`}${x.description?`<p>${esc(x.description)}</p>`:''}<a class="b" href="#shop">Shop now</a></div></div>`).join('');
$('#dots').innerHTML=sl.map((_,i)=>`<i data-i="${i}"></i>`).join('');
let k=0;const go=i=>{k=(i+sl.length)%sl.length;document.querySelectorAll('.sl').forEach((s,j)=>s.classList.toggle('on',j==k));document.querySelectorAll('.dots i').forEach((d,j)=>d.classList.toggle('on',j==k))};
$('#dots').onclick=e=>{if(e.target.dataset.i)go(+e.target.dataset.i)};
if(sl.length<2)$('#dots').style.display='none';else if(!matchMedia('(prefers-reduced-motion:reduce)').matches)setInterval(()=>go(k+1),6000);go(0);
/* categories + products */
const cats=[...new Set(P.map(x=>x.category).filter(Boolean))];let cat='All',q='';
$('#nv').innerHTML=`<button data-c="All">All products</button>`+cats.slice(0,8).map(c=>`<button data-c="${esc(c)}">${esc(c)}</button>`).join('')+`<a href="#contact">Contact</a>`;
$('#cats').innerHTML=cats.map(c=>{const f=P.find(x=>x.category==c&&x.image);return `<button class="ct" data-c="${esc(c)}" style="font:inherit"><div class="i">${f?`<img loading="lazy" src="${esc(f.image)}" alt="${esc(c)}" onerror="this.remove()">`:''}</div><b>${esc(c)}</b></button>`}).join('');
$('#fCats').innerHTML=cats.map(c=>`<li><a href="#shop" data-c="${esc(c)}">${esc(c)}</a></li>`).join('');
const cart='<svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h10.2L20 7H6.2"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>';
function draw(){const a=P.filter(x=>(cat=='All'||x.category==cat)&&(x.title+' '+(x.description||'')+' '+(x.category||'')).toLowerCase().includes(q));
 $('#pt').textContent=$('#bc').textContent=cat=='All'?'All products':cat;$('#rc').textContent=`Showing ${a.length} of ${P.length} results`;
 $('#grid').innerHTML=a.map(x=>`<article class="card"><div class="ph">${x.demo?'<i class="sm">Sample</i>':''}${x.image?`<img loading="lazy" src="${esc(x.image)}" alt="${esc(x.title)}" onerror="this.remove()">`:''}</div><h3>${esc(x.title)}</h3>${x.price?`<div class="pr">${esc(price(x.price))}</div>`:''}<a class="ad" href="${esc(wa('Hello '+NAME+', I want to know about: '+x.title))}" target="_blank" rel="noopener">${cart} Enquire</a></article>`).join('')||'<div class="empty">No products match your search.</div>'}
document.addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;cat=b.dataset.c;$('#nv').classList.remove('on');draw();$('#shop').scrollIntoView({behavior:'smooth'})});
$('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();draw();if(q)$('#shop').scrollIntoView({behavior:'smooth'})};draw();
})();
</script></body></html>
