<!doctype html><html lang="en" data-admin-guard="true"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AKHI Admin — Admin Management</title><link rel="stylesheet" href="./admin.css"><style>.two{display:grid;grid-template-columns:320px 1fr;gap:14px}.list{display:grid;gap:8px}.user{padding:13px;border:1px solid var(--line);background:#0b1011;border-radius:14px;cursor:pointer}.user b{display:block;font-size:12px}.user small{display:block;color:#6e7a74;font-size:10px;margin-top:5px}.user.active{border-color:rgba(214,255,71,.35)}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:13px}.field label{display:block;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#738078;margin-bottom:7px}.field input,.field select{width:100%;background:#0a0f10;color:#f3f5f2;border:1px solid var(--line);border-radius:12px;padding:12px;outline:none}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:1px solid var(--line);background:#0c1112;color:#f3f5f2;padding:11px 14px;border-radius:12px;cursor:pointer}.btn.primary{background:#d6ff47;color:#080b0c;border:0;font-weight:800}.btn.danger{color:#ff9090}.status{min-height:18px;margin-top:12px;color:#aab3ae;font-size:11px}.status.err{color:#ff9090}.hint{color:#69746e;font-size:10px;line-height:1.6;margin-top:5px}@media(max-width:860px){.two{grid-template-columns:1fr}.row{grid-template-columns:1fr}}</style></head><body><main class="page"><div id="app"></div></main>
<script src="../firebase-config.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-storage-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-functions-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-check-compat.js"></script><script src="../firebase-init.js"></script><script src="./auth.js"></script><script src="./admin-shell.js"></script>
<script>
(async function(){if(!(await AKIAdmin.requireSuperAdmin()))return;const $=s=>document.querySelector(s),msg=(t,b=false)=>{const e=$('#status');e.textContent=t;e.className='status'+(b?' err':'')};document.querySelector('main').innerHTML='<div class="head"><div><div class="kicker">Private control / Firebase</div><h1 class="title">Admin Management</h1><p class="sub">Create, update, disable or delete administrator accounts. Passwords are handled by Firebase Authentication and are never stored in Firestore.</p></div><a class="back" href="./dashboard.html">← Dashboard</a></div><div class="two"><aside class="panel"><div class="actions" style="margin-top:0"><button id="new" class="btn primary">+ New Admin</button></div><div id="list" class="list" style="margin-top:14px"></div></aside><section class="panel"><div class="kicker">Account editor</div><form id="form"><input id="uid" type="hidden"><div class="row"><div class="field"><label>Name</label><input id="name" required></div><div class="field"><label>Email</label><input id="email" type="email" required></div></div><div class="row"><div class="field"><label>Role</label><select id="role"><option value="admin">Admin</option><option value="superadmin">Super Admin</option></select><div class="hint">This control is visible only to Super Admin.</div></div><div class="field"><label>Status</label><select id="active"><option value="true">Active</option><option value="false">Disabled</option></select></div></div><div class="field"><label>Password</label><input id="password" type="password" minlength="10" placeholder="Required for new accounts; leave blank to keep current password"><div class="hint">Firebase Authentication handles the credential. Existing passwords cannot be read back.</div></div><div class="actions"><button class="btn primary" type="submit">Save Account</button><button class="btn" type="button" id="resetPwd">Send Password Reset</button><button class="btn danger" type="button" id="delete">Delete Account</button><button class="btn" type="button" id="clear">New / Clear</button></div><div id="status" class="status"></div></form></section></div>';const list=$('#list');let selected=null;
function renderList(items){list.innerHTML=items.map(a=>'<div class="user '+(selected&&selected.uid===a.uid?'active':'')+'" data-uid="'+a.uid+'"><b>'+String(a.name||'Admin')+(a.role==='superadmin'?' • private':'')+'</b><small>'+String(a.email||'')+' • '+String(a.active===false?'disabled':a.role)+'</small></div>').join('')||'<div class="hint">No administrator profiles found.</div>';list.querySelectorAll('.user').forEach(x=>x.onclick=()=>load(items.find(a=>a.uid===x.dataset.uid)))}
async function refresh(){renderList(await AKIAdmin.getAdminUsers())}
function clearForm(){selected=null;$('#uid').value='';$('#name').value='';$('#email').value='';$('#role').value='admin';$('#active').value='true';$('#password').value='';renderList([]);msg('Create a new administrator.')}
function load(a){selected=a;$('#uid').value=a.uid;$('#name').value=a.name||'';$('#email').value=a.email||'';$('#role').value=a.role||'admin';$('#active').value=String(a.active!==false);$('#password').value='';msg('Editing '+a.email);refresh()}
$('#new').onclick=clearForm;$('#clear').onclick=clearForm;
$('#resetPwd').onclick=async()=>{if(!selected)return msg('Select an account first.',true);try{await AKIAdmin.sendPasswordReset(selected.email);await AKIAdmin.logActivity('admin.password_reset_requested',{uid:selected.uid,email:selected.email});msg('Password reset email sent to '+selected.email+'.')}catch(err){msg(err.message||'Unable to send reset email.',true)}};
$('#delete').onclick=async()=>{if(!selected)return msg('Select an account first.',true);if(selected.role==='superadmin')return msg('Super Admin accounts cannot be deleted from this panel.',true);if(!confirm('Delete '+selected.email+' permanently?'))return;try{await AKIAdmin.call('deleteAdmin',{uid:selected.uid});await AKIAdmin.logActivity('admin.deleted',{uid:selected.uid,email:selected.email});clearForm();await refresh();msg('Account deleted.')}catch(err){msg(err.message||'Delete failed.',true)}};
$('#form').onsubmit=async e=>{e.preventDefault();try{const data={uid:$('#uid').value||null,name:$('#name').value.trim(),email:$('#email').value.trim().toLowerCase(),role:$('#role').value,active:$('#active').value==='true'};const pw=$('#password').value;if(!data.name||!data.email)throw new Error('Name and email are required.');if(!selected&&!pw)throw new Error('Set a password for a new account.');if(pw&&pw.length<10)throw new Error('Password must be at least 10 characters.');if(pw)data.password=pw;const res=await AKIAdmin.call(selected?'updateAdmin':'createAdmin',data);selected=res.data;await AKIAdmin.logActivity(selected?'admin.updated':'admin.created',{uid:selected.uid,email:selected.email,role:selected.role});await refresh();load(selected);msg('Account saved securely in Firebase.')}catch(err){msg(err.message||'Unable to save account.',true)}};
await refresh();clearForm();})();</script></body></html>
