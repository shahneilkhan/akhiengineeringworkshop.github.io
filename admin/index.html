<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="AKI Engineering Workshop — Administration Command Center"
  >

  <meta
    name="theme-color"
    content="#07090c"
  >

  <title>Admin Control Center | AKI Engineering Workshop</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #06080b;
      --panel: #0c1015;
      --panel-2: #10151b;

      --border: rgba(255,255,255,.08);
      --border-strong: rgba(255,255,255,.13);

      --text: #f5f7fa;
      --muted: #929ca8;
      --muted-2: #626c78;

      --accent: #c8ff3d;
      --accent-soft: rgba(200,255,61,.08);
      --accent-border: rgba(200,255,61,.20);

      --blue: #7aa8ff;
      --purple: #b88cff;
      --orange: #ffb45e;
      --red: #ff657d;
      --cyan: #61dfff;

      --sidebar: 270px;
      --topbar: 78px;

      --radius-xl: 25px;
      --radius-lg: 19px;
      --radius-md: 14px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: "Inter", sans-serif;
      color: var(--text);

      background:
        radial-gradient(
          circle at 82% 0%,
          rgba(200,255,61,.055),
          transparent 28%
        ),
        radial-gradient(
          circle at 0% 100%,
          rgba(122,168,255,.035),
          transparent 30%
        ),
        var(--bg);

      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================================
       SIDEBAR
    ========================================= */

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: var(--sidebar);
      z-index: 100;

      display: flex;
      flex-direction: column;

      padding: 22px 14px;

      background: rgba(9,12,16,.96);
      border-right: 1px solid var(--border);

      backdrop-filter: blur(25px);

      transition: transform .3s ease;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;

      padding: 3px 9px 23px;

      border-bottom: 1px solid var(--border);
    }

    .brand-logo {
      width: 43px;
      height: 43px;

      display: grid;
      place-items: center;

      border-radius: 13px;

      background: var(--accent);
      color: #070900;

      font-family: "Space Grotesk", sans-serif;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: -1px;

      box-shadow:
        0 0 30px rgba(200,255,61,.14);
    }

    .brand-title {
      font-family: "Space Grotesk", sans-serif;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .brand-subtitle {
      margin-top: 3px;
      color: var(--muted-2);
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 1.25px;
      text-transform: uppercase;
    }

    .nav-label {
      padding: 24px 11px 9px;

      color: #4e5864;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-link {
      min-height: 44px;

      display: flex;
      align-items: center;
      gap: 11px;

      padding: 0 12px;

      border: 1px solid transparent;
      border-radius: 12px;

      color: var(--muted);

      font-size: 11px;
      font-weight: 600;

      transition: .2s ease;
    }

    .nav-link svg {
      width: 17px;
      height: 17px;
      flex: 0 0 17px;
    }

    .nav-link:hover {
      color: var(--text);
      background: rgba(255,255,255,.035);
      border-color: var(--border);
    }

    .nav-link.active {
      color: var(--accent);
      background: var(--accent-soft);
      border-color: rgba(200,255,61,.12);
    }

    .nav-badge {
      margin-left: auto;

      min-width: 20px;
      height: 20px;

      padding: 0 5px;

      display: grid;
      place-items: center;

      border-radius: 999px;

      background: rgba(255,255,255,.055);

      color: var(--muted-2);

      font-size: 8px;
      font-weight: 800;
    }

    .nav-link.active .nav-badge {
      background: rgba(200,255,61,.12);
      color: var(--accent);
    }

    .sidebar-bottom {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .ai-card {
      padding: 14px;

      border: 1px solid rgba(200,255,61,.12);
      border-radius: 16px;

      background:
        radial-gradient(
          circle at 100% 0,
          rgba(200,255,61,.08),
          transparent 45%
        ),
        rgba(255,255,255,.02);
    }

    .ai-card-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 9px;
    }

    .ai-status {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    .ai-card strong {
      font-family: "Space Grotesk", sans-serif;
      font-size: 11px;
    }

    .ai-card p {
      color: var(--muted-2);
      font-size: 9px;
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .ai-card a {
      display: block;

      padding: 9px;

      border-radius: 9px;

      background: var(--accent);
      color: #070900;

      text-align: center;

      font-size: 9px;
      font-weight: 900;
    }

    .logout {
      width: 100%;
      height: 39px;

      margin-top: 9px;

      display: flex;
      align-items: center;
      gap: 9px;

      padding: 0 11px;

      border: 1px solid transparent;
      border-radius: 10px;

      background: transparent;

      color: var(--muted-2);

      text-align: left;

      font-size: 10px;
      font-weight: 600;
    }

    .logout:hover {
      color: var(--red);
      background: rgba(255,101,125,.05);
      border-color: rgba(255,101,125,.10);
    }

    /* =========================================
       MAIN
    ========================================= */

    .main {
      min-height: 100vh;
      margin-left: var(--sidebar);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 60;

      height: var(--topbar);

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 30px;

      background: rgba(6,8,11,.78);
      border-bottom: 1px solid var(--border);

      backdrop-filter: blur(22px);
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mobile-menu {
      display: none;

      width: 37px;
      height: 37px;

      border: 1px solid var(--border);
      border-radius: 10px;

      background: rgba(255,255,255,.025);
      color: var(--text);
    }

    .breadcrumb {
      color: var(--muted-2);
      font-size: 10px;
    }

    .breadcrumb strong {
      color: var(--text);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .online {
      height: 34px;

      display: flex;
      align-items: center;
      gap: 7px;

      padding: 0 11px;

      border: 1px solid rgba(200,255,61,.12);
      border-radius: 999px;

      background: rgba(200,255,61,.04);

      color: var(--accent);

      font-size: 8px;
      font-weight: 800;
      letter-spacing: .3px;
    }

    .online span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 9px var(--accent);
    }

    .top-icon {
      width: 35px;
      height: 35px;

      display: grid;
      place-items: center;

      border: 1px solid var(--border);
      border-radius: 10px;

      background: rgba(255,255,255,.025);
      color: var(--muted);
    }

    .top-icon:hover {
      color: var(--accent);
      border-color: var(--accent-border);
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 9px;

      padding-left: 4px;
    }

    .avatar {
      width: 35px;
      height: 35px;

      display: grid;
      place-items: center;

      border-radius: 10px;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          #7fa91d
        );

      color: #070900;

      font-size: 10px;
      font-weight: 900;
    }

    .profile-text strong {
      display: block;
      font-size: 9px;
    }

    .profile-text span {
      display: block;
      margin-top: 2px;
      color: var(--accent);
      font-size: 7px;
      font-weight: 800;
      text-transform: uppercase;
    }

    /* =========================================
       CONTENT
    ========================================= */

    .content {
      max-width: 1500px;
      margin: 0 auto;
      padding: 31px 30px 55px;
    }

    .hero {
      position: relative;
      overflow: hidden;

      min-height: 235px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 30px;

      padding: 38px;

      border: 1px solid var(--border);
      border-radius: var(--radius-xl);

      background:
        radial-gradient(
          circle at 88% 40%,
          rgba(200,255,61,.12),
          transparent 32%
        ),
        radial-gradient(
          circle at 70% 100%,
          rgba(200,255,61,.045),
          transparent 35%
        ),
        rgba(255,255,255,.022);

      margin-bottom: 18px;
    }

    .hero::after {
      content: "";

      position: absolute;

      width: 270px;
      height: 270px;

      right: 80px;
      top: -115px;

      border: 1px solid rgba(200,255,61,.08);
      border-radius: 50%;

      box-shadow:
        0 0 0 35px rgba(200,255,61,.018),
        0 0 0 70px rgba(200,255,61,.012);

      pointer-events: none;
    }

    .hero-copy {
      position: relative;
      z-index: 2;
      max-width: 700px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      color: var(--accent);

      font-size: 8px;
      font-weight: 900;

      letter-spacing: 1.6px;
      text-transform: uppercase;

      margin-bottom: 12px;
    }

    .eyebrow::before {
      content: "";
      width: 18px;
      height: 1px;
      background: var(--accent);
    }

    .hero h1 {
      font-family: "Space Grotesk", sans-serif;

      font-size: clamp(30px, 4vw, 52px);

      line-height: .98;

      letter-spacing: -2.5px;
    }

    .hero h1 span {
      color: var(--accent);
    }

    .hero p {
      max-width: 620px;

      margin-top: 14px;

      color: var(--muted);

      font-size: 11px;
      line-height: 1.75;
    }

    .hero-actions {
      display: flex;
      gap: 8px;
      margin-top: 21px;
    }

    .primary-button,
    .secondary-button {
      min-height: 40px;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      padding: 0 14px;

      border-radius: 11px;

      font-size: 9px;
      font-weight: 800;

      transition: .2s ease;
    }

    .primary-button {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #070900;
    }

    .primary-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(200,255,61,.14);
    }

    .secondary-button {
      border: 1px solid var(--border);
      background: rgba(255,255,255,.025);
      color: var(--text);
    }

    .secondary-button:hover {
      border-color: var(--border-strong);
      background: rgba(255,255,255,.05);
    }

    .hero-orb {
      position: relative;
      z-index: 2;

      width: 145px;
      height: 145px;

      flex: 0 0 145px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 32% 28%,
          #efffc2,
          var(--accent) 21%,
          #7fa91d 47%,
          #121807 69%,
          #07090c 100%
        );

      box-shadow:
        0 0 45px rgba(200,255,61,.16),
        0 0 100px rgba(200,255,61,.06);

      animation: orbFloat 5s ease-in-out infinite;
    }

    .hero-orb::before,
    .hero-orb::after {
      content: "";

      position: absolute;

      border: 1px solid rgba(200,255,61,.12);
      border-radius: 50%;
    }

    .hero-orb::before {
      inset: -17px;
    }

    .hero-orb::after {
      inset: -32px;
      border-style: dashed;
      opacity: .4;
      animation: spin 16s linear infinite;
    }

    .hero-orb strong {
      color: #071000;

      font-family: "Space Grotesk", sans-serif;

      font-size: 27px;
      font-weight: 900;

      letter-spacing: -2px;
    }

    /* =========================================
       SECTION HEADER
    ========================================= */

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;

      gap: 15px;

      margin: 27px 2px 12px;
    }

    .section-head h2 {
      font-family: "Space Grotesk", sans-serif;
      font-size: 17px;
      letter-spacing: -.7px;
    }

    .section-head p {
      margin-top: 4px;
      color: var(--muted-2);
      font-size: 9px;
    }

    .view-all {
      color: var(--accent);
      font-size: 9px;
      font-weight: 800;
    }

    /* =========================================
       CONTROL GRID
    ========================================= */

    .control-grid {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0,1fr));

      gap: 12px;
    }

    .control-card {
      position: relative;
      overflow: hidden;

      min-height: 175px;

      padding: 20px;

      border:
