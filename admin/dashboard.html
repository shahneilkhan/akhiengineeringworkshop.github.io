<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="AKI Engineering Workshop Administration Dashboard"
  >

  <meta name="theme-color" content="#07090c">

  <title>Dashboard | AKI Engineering Workshop</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #07090c;
      --bg-2: #0a0d11;
      --panel: #0d1116;
      --panel-2: #11161d;

      --border: rgba(255,255,255,.08);
      --border-hover: rgba(200,255,61,.28);

      --text: #f5f7fa;
      --muted: #8d98a6;
      --muted-2: #626d7a;

      --accent: #c8ff3d;
      --accent-soft: rgba(200,255,61,.08);
      --accent-glow: rgba(200,255,61,.20);

      --danger: #ff637b;
      --blue: #75a8ff;
      --orange: #ffb45e;

      --sidebar: 270px;
      --topbar: 78px;

      --radius-xl: 25px;
      --radius-lg: 19px;
      --radius-md: 14px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      font-family: "Inter", sans-serif;
      color: var(--text);
      background:
        radial-gradient(
          circle at 80% 0%,
          rgba(200,255,61,.055),
          transparent 28%
        ),
        radial-gradient(
          circle at 10% 100%,
          rgba(117,168,255,.035),
          transparent 25%
        ),
        var(--bg);
      overflow-x: hidden;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================================
       SIDEBAR
    ========================================= */

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: var(--sidebar);
      z-index: 100;
      display: flex;
      flex-direction: column;
      padding: 23px 15px;
      background: rgba(10,13,17,.94);
      border-right: 1px solid var(--border);
      backdrop-filter: blur(25px);
      transition: transform .3s ease;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 3px 9px 25px;
      border-bottom: 1px solid var(--border);
    }

    .brand-logo {
      width: 43px;
      height: 43px;
      flex: 0 0 43px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: var(--accent);
      color: #070900;
      font-family: "Space Grotesk", sans-serif;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: -1px;
      box-shadow: 0 0 25px rgba(200,255,61,.12);
    }

    .brand-title {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: -.5px;
    }

    .brand-subtitle {
      margin-top: 3px;
      color: var(--muted-2);
      font-size: 9px;
      letter-spacing: 1.3px;
      text-transform: uppercase;
    }

    .nav-label {
      padding: 25px 11px 9px;
      color: #505b68;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-link {
      min-height: 45px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      border: 1px solid transparent;
      border-radius: 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      transition: .2s ease;
    }

    .nav-link svg {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
    }

    .nav-link:hover {
      color: var(--text);
      background: rgba(255,255,255,.035);
      border-color: var(--border);
    }

    .nav-link.active {
      color: var(--accent);
      background: var(--accent-soft);
      border-color: rgba(200,255,61,.13);
    }

    .nav-link .nav-badge {
      margin-left: auto;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      color: var(--muted);
      font-size: 9px;
    }

    .nav-link.active .nav-badge {
      background: rgba(200,255,61,.12);
      color: var(--accent);
    }

    .sidebar-bottom {
      margin-top: auto;
      padding-top: 15px;
      border-top: 1px solid var(--border);
    }

    .ai-mini-card {
      padding: 15px;
      border: 1px solid rgba(200,255,61,.12);
      border-radius: 16px;
      background:
        radial-gradient(
          circle at 90% 10%,
          rgba(200,255,61,.09),
          transparent 40%
        ),
        rgba(255,255,255,.02);
    }

    .ai-mini-head {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 10px;
    }

    .ai-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    .ai-mini-head strong {
      font-family: "Space Grotesk", sans-serif;
      font-size: 12px;
    }

    .ai-mini-card p {
      color: var(--muted-2);
      font-size: 10px;
      line-height: 1.55;
      margin-bottom: 11px;
    }

    .ai-mini-card a {
      display: block;
      padding: 9px;
      border-radius: 9px;
      background: var(--accent);
      color: #070900;
      text-align: center;
      font-size: 10px;
      font-weight: 800;
    }

    .logout {
      width: 100%;
      height: 40px;
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 11px;
      border: 1px solid transparent;
      border-radius: 11px;
      background: transparent;
      color: var(--muted-2);
      text-align: left;
      font-size: 11px;
      font-weight: 600;
    }

    .logout:hover {
      color: var(--danger);
      background: rgba(255,99,123,.05);
      border-color: rgba(255,99,123,.10);
    }

    /* =========================================
       MAIN
    ========================================= */

    .main {
      min-height: 100vh;
      margin-left: var(--sidebar);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      height: var(--topbar);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 0 30px;
      background: rgba(7,9,12,.78);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(20px);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .mobile-menu {
      display: none;
      width: 38px;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255,255,255,.025);
      color: var(--text);
    }

    .page-label {
      color: var(--muted-2);
      font-size: 11px;
    }

    .page-label strong {
      color: var(--text);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status {
      height: 36px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 11px;
      border: 1px solid rgba(200,255,61,.12);
      border-radius: 999px;
      background: rgba(200,255,61,.045);
      color: var(--accent);
      font-size: 9px;
      font-weight: 800;
    }

    .status span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 9px var(--accent);
    }

    .icon-button {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255,255,255,.025);
      color: var(--muted);
    }

    .icon-button:hover {
      color: var(--accent);
      border-color: var(--border-hover);
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 9px;
      padding-left: 5px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: linear-gradient(
        135deg,
        var(--accent),
        #7ea91e
      );
      color: #080b03;
      font-size: 11px;
      font-weight: 900;
    }

    .profile-info strong {
      display: block;
      font-size: 10px;
    }

    .profile-info span {
      display: block;
      margin-top: 2px;
      color: var(--accent);
      font-size: 8px;
      font-weight: 700;
    }

    /* =========================================
       CONTENT
    ========================================= */

    .content {
      max-width: 1500px;
      margin: 0 auto;
      padding: 32px 30px 50px;
    }

    .welcome {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 25px;
      margin-bottom: 27px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 10px;
      color: var(--accent);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 16px;
      height: 1px;
      background: var(--accent);
    }

    .welcome h1 {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(30px, 4vw, 48px);
      line-height: 1;
      letter-spacing: -2px;
    }

    .welcome h1 span {
      color: var(--accent);
    }

    .welcome p {
      max-width: 580px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .date-box {
      flex: 0 0 auto;
      min-width: 155px;
      padding: 13px 15px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: rgba(255,255,255,.02);
    }

    .date-box span {
      display: block;
      color: var(--muted-2);
      font-size: 9px;
      margin-bottom: 5px;
    }

    .date-box strong {
      font-size: 12px;
    }

    /* =========================================
       STATISTICS
    ========================================= */

    .stats-grid {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0,1fr));
      gap: 13px;
      margin-bottom: 24px;
    }

    .stat-card {
      position: relative;
      overflow: hidden;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: rgba(255,255,255,.025);
      transition: .25s ease;
    }

    .stat-card::after {
      content: "";
      position: absolute;
      width: 100px;
      height: 100px;
      right: -45px;
      top: -45px;
      border-radius: 50%;
      background: var(--accent);
      opacity: .035;
      filter: blur(15px);
    }

    .stat-card:hover {
      transform: translateY(-3px);
      border-color: var(--border-hover);
    }

    .stat-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .stat-icon {
      width: 37px;
      height: 37px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: rgba(200,255,61,.07);
      color: var(--accent);
    }

    .stat-icon.blue {
      background: rgba(117,168,255,.08);
      color: var(--blue);
    }

    .stat-icon.orange {
      background: rgba(255,180,94,.08);
      color: var(--orange);
    }

    .stat-icon.red {
      background: rgba(255,99,123,.08);
      color: var(--danger);
    }

    .stat-change {
      color: var(--accent);
      font-size: 9px;
      font-weight: 700;
    }

    .stat-card h3 {
      font-family: "Space Grotesk", sans-serif;
      font-size: 28px;
      letter-spacing: -1px;
    }

    .stat-card p {
      margin-top: 5px;
      color: var(--muted-2);
      font-size: 10px;
    }

    /* =========================================
       MAIN GRID
    ========================================= */

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1.35fr .65fr;
      gap: 15px;
      margin-bottom: 15px;
    }

    .panel {
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      background: rgba(255,255,255,.022);
      overflow: hidden;
    }

    .panel-head {
      min-height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
    }

    .panel-title {
      font-family: "Space Grotesk", sans-serif;
      font-size: 14px;
