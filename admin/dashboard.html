<!doctype html><html lang="en" data-admin-guard="true"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AKHI Admin Dashboard</title><link rel="stylesheet" href="./admin.css"></head><body><main class="page"><div id="app"></div></main>
<script src="../firebase-config.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-storage-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-functions-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-check-compat.js"></script><script src="../firebase-init.js"></script><script src="./auth.js"></script><script src="./admin-shell.js"></script>
<script>
(async function(){if(!(await AKIAdmin.requireAuth()))return;const $=s=>document.querySelector(s);const p=await AKIAdmin.getProfile();document.querySelector('#app').innerHTML='<div class="head"><div><div class="kicker">Operations / Firebase</div><h1 class="title">Good to have you back.</h1><p class="sub">Manage the AKHI Engineering Workshop website from one production control layer.</p></div><div class="head-actions"><span class="pill">'+(p.role==='superadmin'?'PRIVATE CONTROL':'ADMIN')+'</span><button class="btn" data-admin-logout>Log out</button></div></div><section class="stat-grid"><div class="panel stat"><strong id="projects">—</strong><span>Published projects</span></div><div class="panel stat"><strong id="banners">—</strong><span>Published banners</span></div><div class="panel stat"><strong id="media">—</strong><span>Media records</span></div><div class="panel stat"><strong id="activity">—</strong><span>Activity events</span></div></section><section class="split"><div class="panel"><div class="kicker">Workspace</div><h2>Content control</h2><div class="quick"><a href="./homepage.html">Homepage<span>Content</span></a><a href="./banner.html">Banners<span>Campaigns</span></a><a href="./projects.html">Projects<span>Portfolio</span></a><a href="./media.html">Media<span>Storage</span></a><a href="./settings.html">Settings<span>Business</span></a><a href="./activity.html">Activity<span>Audit trail</span></a><a href="./backup.html">Backup<span>Recovery</span></a><a href="./qa.html">QA<span>System checks</span></a><a href="./responsive.html">Responsive<span>Viewport lab</span></a></div></div><div class="panel"><div class="kicker">Private control</div><h2>Security & administrators</h2><div class="quick"><a href="./security.html">Security Center<span>Sessions & App Check</span></a><a id="adminsLink" href="./admins.html">Admin Management<span>Accounts</span></a></div><div class="note" style="margin-top:14px">'+(p.role==='superadmin'?'Super Admin controls are enabled.':'Your access is limited to approved admin permissions.')+'</div></div></section><div class="footerline"><span>AKHI ADMIN / FIREBASE 1.19</span><a href="../">← Website</a></div>';
  if(p.role!=='superadmin')$('#adminsLink').style.display='none';document.querySelectorAll('[data-admin-logout]').forEach(b=>b.addEventListener('click',()=>AKIAdmin.logout(true)));
  try{const db=window.AKHI_FIREBASE.db;const [ps,bs,ms,as]=await Promise.all([db.collection('projects').where('published','==',true).get(),db.collection('banners').where('published','==',true).get(),db.collection('media').get(),db.collection('activityLogs').orderBy('at','desc').limit(300).get()]);$('#projects').textContent=ps.size;$('#banners').textContent=bs.size;$('#media').textContent=ms.size;$('#activity').textContent=as.size}catch(err){console.warn(err);['projects','banners','media','activity'].forEach(k=>$('#'+k).textContent='0')}})();
</script></body></html>
