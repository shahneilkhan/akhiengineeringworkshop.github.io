<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin sign in</title><link rel="stylesheet" href="../admin.css"></head><body><div class="login"><div class="card"><h1>Admin sign in</h1><form id="f"><label>Email</label><input id="e" type="email" autocomplete="username" required><label>Password</label><input id="p" type="password" autocomplete="current-password" required><label class="chk"><input type="checkbox" id="rm"> Remember this device</label><p id="msg"></p><button class="btn pri" style="width:100%">Sign in</button></form></div></div>
<script>window.ADMIN_BASE='../'</script><script src="../../firebase-config.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="../auth.js"></script>
<script>AKIAdmin.ready.then(p=>{if(p)location.href='../dashboard.html'});document.getElementById('f').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('msg');m.className='';m.textContent='Signing in…';try{await AKIAdmin.login(document.getElementById('e').value,document.getElementById('p').value,document.getElementById('rm').checked);location.href='../dashboard.html'}catch(x){m.className='err';m.textContent=/not an active/.test(x.message)?x.message:'Email or password is wrong.'}}</script></body></html>
