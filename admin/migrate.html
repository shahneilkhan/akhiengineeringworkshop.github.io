<!doctype html><html lang="en" data-admin-guard="true"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AKHI Admin — Migration Center</title><link rel="stylesheet" href="./admin.css"><style>.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.box{padding:16px;border:1px solid var(--line);background:#0b1011;border-radius:14px}.box strong{display:block;font-size:27px}.box span{display:block;color:#6d7872;font-size:9px;letter-spacing:.1em;text-transform:uppercase;margin-top:4px}.progress{height:8px;background:#0c1112;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:18px}.bar{height:100%;width:0;background:#d6ff47;transition:.25s}.log{margin-top:14px;max-height:340px;overflow:auto}.log div{padding:9px 11px;border-bottom:1px solid var(--line);font-size:11px;color:#8d9892}@media(max-width:780px){.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="page"><div id="app"></div></main>
<script src="../firebase-config.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-storage-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-functions-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-check-compat.js"></script><script src="../firebase-init.js"></script><script src="./auth.js"></script><script src="./admin-shell.js"></script>
<script>
(async function(){if(!(await AKIAdmin.requireSuperAdmin()))return;const $=s=>document.querySelector(s),safe=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch(_){return f}}, log=t=>{$('#log').insertAdjacentHTML('afterbegin','<div>'+String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</div>')};document.querySelector('main').innerHTML='<div class="head"><div><div class="kicker">Private control / migration</div><h1 class="title">Migration Center</h1><p class="sub">Move the existing browser-side AKHI content into the production Firebase collections. This page does not migrate passwords or browser sessions.</p></div><a class="back" href="./dashboard.html">← Dashboard</a></div><section class="panel"><div class="stats"><div class="box"><strong id="home">0</strong><span>Home records</span></div><div class="box"><strong id="banners">0</strong><span>Banners</span></div><div class="box"><strong id="projects">0</strong><span>Projects</span></div><div class="box"><strong id="media">0</strong><span>Media</span></div></div><div class="progress"><div id="bar" class="bar"></div></div><div class="actions" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px"><button id="scan" class="btn">Scan local data</button><button id="run" class="btn primary">Migrate to Firebase</button></div><div id="status" class="status"></div><div id="log" class="log"></div></section></section>';
function scan(){const h=safe('aki_homepage_content_v1',null),b=safe('aki_banners_v1',[]),p=safe('aki_projects_v1',[]),m=safe('aki_media_v1',[]);$('#home').textContent=h?1:0;$('#banners').textContent=Array.isArray(b)?b.length:0;$('#projects').textContent=Array.isArray(p)?p.length:0;$('#media').textContent=Array.isArray(m)?m.length:0;log('Scan complete.')}
$('#scan').onclick=scan;
$('#run').onclick=async()=>{const h=safe('aki_homepage_content_v1',null),b=safe('aki_banners_v1',[]),p=safe('aki_projects_v1',[]),m=safe('aki_media_v1',[]),s=safe('aki_site_settings_v1',null),a=safe('aki_admin_activity_v1',[]);const jobs=[];if(h)jobs.push(['home',()=>db().collection('siteContent').doc('home').set({...h,migratedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})]);if(s)jobs.push(['settings',()=>db().collection('siteContent').doc('settings').set({...s,migratedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})]);for(const x of (Array.isArray(b)?b:[]))jobs.push(['banner',()=>(x.id ? db().collection('banners').doc(x.id) : db().collection('banners').doc()).set({...x,migratedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})]);for(const x of (Array.isArray(p)?p:[]))jobs.push(['project',()=>(x.id ? db().collection('projects').doc(x.id) : db().collection('projects').doc()).set({...x,migratedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})]);for(const x of (Array.isArray(m)?m:[]))jobs.push(['media',()=>(x.id ? db().collection('media').doc(x.id) : db().collection('media').doc()).set({...x,migratedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})]);let done=0;$('#bar').style.width='0';for(const [label,job] of jobs){try{await job();log('Migrated '+label+'.')}catch(err){log('FAILED '+label+': '+err.message)}done++;$('#bar').style.width=(done/jobs.length*100)+'%'}for(const x of (Array.isArray(a)?a.slice(0,100):[])){try{await db().collection('activityLogs').add({action:'migrated.preFirebase.'+(x.action||'event'),uid:AKIAdmin.getSession().uid,email:AKIAdmin.getSession().email,role:'superadmin',meta:x.meta||{},at:x.at?new Date(x.at):firebase.firestore.FieldValue.serverTimestamp()})}catch(_){}}await AKIAdmin.logActivity('migration.completed',{jobs:jobs.length});$('#status').textContent='Migration complete. Firebase is now the source of truth.'};scan();})();
</script></body></html>
